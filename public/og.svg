<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <radialGradient id="g1" cx="78%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#06D6A0" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#0A0E17" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0%" cy="90%" r="70%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#0A0E17" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06D6A0"/>
      <stop offset="60%" stop-color="#7CF2D2"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0A0E17"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>

  <!-- territory motif -->
  <g transform="translate(770,120)">
    <polygon points="60,120 250,80 320,230 210,330 70,280" fill="#06D6A0" fill-opacity="0.18"/>
    <polygon points="60,120 250,80 320,230 210,330 70,280" fill="none" stroke="#06D6A0" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="250" cy="80" r="9" fill="#06D6A0"/>
    <g transform="translate(250,80)">
      <rect x="-1.5" y="-48" width="3" height="48" fill="#cbd5e1"/>
      <path d="M0,-48 h30 l-8,9 l8,9 h-30 z" fill="#FF6B35"/>
    </g>
  </g>

  <!-- logo + wordmark -->
  <g transform="translate(90,96)">
    <rect width="56" height="56" rx="14" fill="#06D6A0" fill-opacity="0.14" stroke="#06D6A0" stroke-opacity="0.4"/>
    <path d="M28 12l15 8.7v17.6L28 47l-15-8.7V20.7L28 12z" fill="none" stroke="#06D6A0" stroke-width="2.6" stroke-linejoin="round"/>
    <text x="74" y="38" font-family="'Clash Display','Segoe UI',sans-serif" font-size="30" font-weight="700" fill="#F9FAFB">Stride</text>
  </g>

  <text x="90" y="300" font-family="'Clash Display','Segoe UI',sans-serif" font-size="92" font-weight="700" fill="#F9FAFB">Run a loop.</text>
  <text x="90" y="392" font-family="'Clash Display','Segoe UI',sans-serif" font-size="92" font-weight="700" fill="url(#grad)">Own the block.</text>
  <text x="92" y="452" font-family="'Segoe UI',sans-serif" font-size="28" fill="#9CA3AF">A competitive territory-running game. iOS — join the waitlist.</text>

  <g transform="translate(92,500)">
    <rect width="280" height="56" rx="14" fill="#06D6A0"/>
    <text x="140" y="36" text-anchor="middle" font-family="'Clash Display','Segoe UI',sans-serif" font-size="22" font-weight="600" fill="#04231B">striderunning.run</text>
  </g>
</svg>
